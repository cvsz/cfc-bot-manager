name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Resolve and verify Go modules
        working-directory: backend
        run: go mod tidy

      - name: Validate Go backend
        working-directory: backend
        run: |
          go version
          go test -race ./...
          go vet ./...
          go build ./...

      - name: Validate repository structure and Markdown links
        run: python3 scripts/validate_repo.py

      - name: Exercise startup bootstrap tests
        run: python3 -m unittest discover -s tests -v

      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate rollout shell syntax
        run: bash -n scripts/rollout-independent-review.sh

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

  security-go:
    runs-on: ubuntu-latest
    needs: repository-baseline
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...

  security-python:
    runs-on: ubuntu-latest
    needs: repository-baseline
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318aca5013e9b0f0f577d45e556 # v5.3.0
        with:
          python-version: '3.12'

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: Run ruff linting
        run: ruff check scripts/ tests/

      - name: Run mypy type checking
        run: mypy scripts/ tests/ --ignore-missing-imports

  security-shell:
    runs-on: ubuntu-latest
    needs: repository-baseline
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: find . -name "*.sh" -not -path "./node_modules/*" -not -path "./.git/*" | xargs shellcheck

  sbom:
    runs-on: ubuntu-latest
    needs: repository-baseline
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Generate SBOM (Go)
        uses: anchore/sbom-action@0.17.0
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom-go.spdx.json

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c429bfad43d4d3e25b9c0d62 # v4.0.2
        with:
          node-version: '22'

      - name: Generate SBOM (Frontend)
        uses: anchore/sbom-action@0.17.0
        with:
          path: ./frontend
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f13f0f5387 # v4.3.1
        with:
          name: sbom
          path: |
            sbom-go.spdx.json
            sbom-frontend.spdx.json
